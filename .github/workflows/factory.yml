name: Fábrica de Videos (autónomo)

on:
  schedule:
    # Corre cada 6 horas (UTC). Ajustá la cadencia a tu gusto.
    - cron: "0 */6 * * *"
  workflow_dispatch:        # permite dispararlo a mano desde la pestaña Actions

concurrency:
  group: fabrica-videos
  cancel-in-progress: false

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar worker
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:${{ secrets.SUPABASE_SERVICE_KEY }}
          LLM_PROVIDER:        ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:      ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:     ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID:        ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:    ${{ secrets.YT_CLIENT_SECRET }}
          MAX_VIDEOS_PER_RUN:  "3"
        run: python worker.py
