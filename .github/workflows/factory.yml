name: Fábrica de Videos (autónomo)

on:
  schedule:
    # Corre cada 6 horas (UTC). Cambiá la cadencia si querés más/menos videos.
    - cron: "0 */6 * * *"
  workflow_dispatch:        # permite dispararlo a mano desde la pestaña Actions

concurrency:
  group: fabrica-videos
  cancel-in-progress: false

# Tus archivos quedaron dentro de fabrica-videos-worker/worker,
# así que los comandos se ejecutan desde esa carpeta:
defaults:
  run:
    working-directory: fabrica-videos-worker/worker

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        # apt a veces queda colgado contra el mirror de Ubuntu (11/11/2026: corridas trabadas
        # más de 20 min en este paso). Límite de tiempo + reintentos, y si igual falla se
        # baja un ffmpeg estático desde GitHub.
        timeout-minutes: 6
        run: |
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          if ! (timeout 90 $APT update && timeout 180 $APT install -y ffmpeg fonts-dejavu-core); then
            echo "apt falló o tardó demasiado: uso ffmpeg estático"
            curl -fsSL --retry 3 --max-time 150 -o /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            sudo cp /tmp/ffmpeg/bin/ffmpeg /tmp/ffmpeg/bin/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Instalar Chromium (para capturas de pantalla reales)
        timeout-minutes: 8
        continue-on-error: true   # las capturas son opcionales; no deben frenar la fábrica
        run: timeout 420 playwright install --with-deps chromium
      - name: Ejecutar worker
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LLM_PROVIDER:         ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:      ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID:         ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:     ${{ secrets.YT_CLIENT_SECRET }}
          MAX_VIDEOS_PER_RUN:   "3"
        run: python worker.py
